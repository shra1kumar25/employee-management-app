name: Employee Management CI

on:
  push:
    branches:
      - main
      - feature/docker-compose

  pull_request:
    branches:
      - main

jobs:

  # ==========================================================
  # BACKEND TEST
  # ==========================================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: employee_db
        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d employee_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

     - name: Check PostgreSQL Client
      run: |
      psql --version
      
      - name: Initialize Test Database
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d employee_db \
            -f backend/db/init.sql

      - name: Run Backend Tests
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: employee_db
        run: npm test


  # ==========================================================
  # FRONTEND BUILD
  # ==========================================================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React Application
        working-directory: frontend
        run: npm run build


  # ==========================================================
  # BACKEND DOCKER BUILD
  # ==========================================================
  backend-docker:
    name: Backend Docker Build
    runs-on: ubuntu-latest

    needs:
      - backend-test

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t employee-management-app-backend:ci \
            ./backend


  # ==========================================================
  # FRONTEND DOCKER BUILD
  # ==========================================================
  frontend-docker:
    name: Frontend Docker Build
    runs-on: ubuntu-latest

    needs:
      - frontend-build

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t employee-management-app-frontend:ci \
            ./frontend


  # ==========================================================
  # TRIVY BACKEND
  # ==========================================================
  trivy-backend:
    name: Backend Container Security
    runs-on: ubuntu-latest

    needs:
      - backend-docker

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -t employee-management-app-backend:ci \
            ./backend

      - name: Trivy Backend Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: employee-management-app-backend:ci
          severity: HIGH,CRITICAL
          exit-code: '1'


  # ==========================================================
  # TRIVY FRONTEND
  # ==========================================================
  trivy-frontend:
    name: Frontend Container Security
    runs-on: ubuntu-latest

    needs:
      - frontend-docker

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Frontend Image
        run: |
          docker build \
            -t employee-management-app-frontend:ci \
            ./frontend

      - name: Trivy Frontend Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: employee-management-app-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
