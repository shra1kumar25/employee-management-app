name: Backend CI

on:
  push:
    branches:
      - main
      - feature/docker-compose

  pull_request:
    branches:
      - main

jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: employee_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d employee_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Initialize Database
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d employee_db -f backend/db/init.sql

      - name: Run Tests
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: employee_db
        run: npm test

      - name: Build Docker Image
        run: docker build -t employee-management-app-backend:ci ./backend

      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: employee-management-app-backend:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
