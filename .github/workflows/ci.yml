        options: >-
          --health-cmd="pg_isready -U postgres -d employee_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Initialize Database
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -p 5432 \
            -U postgres \
            -d employee_db \
            -f backend/db/init.sql

      - name: Run Backend Tests
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: employee_db
        run: npm test
