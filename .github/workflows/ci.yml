name: Employee Management CI

on:
  push:
    branches:
      - main
      - feature/docker-compose

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: employee_db
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres -d employee_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Initialize Database Schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d employee_db -f backend/db/init.sql

      - name: Run Backend Tests
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: employee_db
        run: npm test

  frontend-build:
    name: Frontend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test -- --watchAll=false

      - name: Build React Application
        working-directory: frontend
        run: npm run build

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  backend-docker:
    name: Backend Docker Build
    runs-on: ubuntu-latest

    needs:
      - backend-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t employee-management-app-backend:ci ./backend

  frontend-docker:
    name: Frontend Docker Build
    runs-on: ubuntu-latest

    needs:
      - frontend-build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: docker build -t employee-management-app-frontend:ci ./frontend

  trivy-backend:
    name: Backend Container Security
    runs-on: ubuntu-latest

    needs:
      - backend-docker

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t employee-management-app-backend:ci ./backend

      - name: Run Trivy Backend Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: employee-management-app-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"

  trivy-frontend:
    name: Frontend Container Security
    runs-on: ubuntu-latest

    needs:
      - frontend-docker

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Frontend Image
        run: docker build -t employee-management-app-frontend:ci ./frontend

      - name: Run Trivy Frontend Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: employee-management-app-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
  push-backend:
    name: Push Backend Image
    runs-on: ubuntu-latest

    needs:
      - trivy-backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ sra1kumar25 }}
          password: ${{ Xpjwz9gOm44KwH3ESkaCndm2FAE }}

      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ sra1kumar25 }}/employee-management-backend:latest \
            -t ${{ sra1kumar25 }}/employee-management-backend:${{ github.sha }} \
            ./backend

      - name: Push Backend Image
        run: |
          docker push ${{ sra1kumar25 }}/employee-management-backend:latest
          docker push ${{ sra1kumar25 }}/employee-management-backend:${{ github.sha }}
  push-frontend:
    name: Push Frontend Image
    runs-on: ubuntu-latest

    needs:
      - trivy-frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ sra1kumar25 }}
          password: ${{ Xpjwz9gOm44KwH3ESkaCndm2FAE }}

      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ secrets.sra1kumar25 }}/employee-management-frontend:latest \
            -t ${{ secrets. }}/employee-management-frontend:${{ github.sha }} \
            ./frontend

      - name: Push Frontend Image
        run: |
          docker push ${{ sra1kumar25 }}/employee-management-frontend:latest
          docker push ${{ sra1kumar25 }}/employee-management-frontend:${{ github.sha }}

