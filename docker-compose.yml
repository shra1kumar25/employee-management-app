services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: employee-backend

    ports:
      - "5000:5000"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: employee_user
      DB_PASSWORD: employee_password
      DB_NAME: employee_db
      PORT: 5000

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - employee-network

  postgres:
    image: postgres:16-alpine

    container_name: employee-postgres

    environment:
      POSTGRES_USER: employee_user
      POSTGRES_PASSWORD: employee_password
      POSTGRES_DB: employee_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employee_user -d employee_db"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - employee-network


volumes:
  postgres_data:


networks:
  employee-network:
    driver: bridge
